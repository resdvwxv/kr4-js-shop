<!DOCTYPE html>
<html lang="ru">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Страница товара учебного интернет-магазина.">
    <title>Товар — Beyond Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/catalog.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Перейти к основному содержимому</a>
    <div id="header-placeholder"></div>
    <main id="main">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a class="breadcrumbs__link" href="index.html">Главная</a>
            <a class="breadcrumbs__link" href="catalog.html">Каталог</a>
            <span class="breadcrumbs__current" id="breadcrumb-title">Товар</span>
        </nav>

        <section class="section product-detail" id="product-detail">
            <div class="product-detail__inner">
                <div class="product-detail__media">
                    <img id="product-image" class="product-detail__image" src="" alt="" width="640" height="480" loading="lazy">
                </div>
                <div class="product-detail__info">
                    <h1 id="product-title"></h1>
                    <p class="product-detail__category" id="product-category"></p>
                    <p class="product-detail__price" id="product-price"></p>
                    <p class="product-detail__rating" id="product-rating"></p>
                    <p class="product-detail__description" id="product-description"></p>
                    <div class="product-detail__actions">
                        <button class="button button--primary" id="product-order-btn" data-product="">Заказать</button>
                        <a class="button button--secondary" href="catalog.html">← Вернуться в каталог</a>
                    </div>
                </div>
            </div>
        </section>

        <section class="section" id="js-output">
            <h2>Результаты JavaScript</h2>
            <div class="js-training-block">
                <p id="js-message" class="js-message">Подключение JavaScript...</p>
                <div class="product-output" id="product-output"></div>
            </div>
        </section>
    </main>
    <a class="scroll-top" href="#main" aria-label="Наверх">↑</a>

    <div id="footer-placeholder"></div>
    <dialog class="order-dialog" id="order-dialog" aria-labelledby="order-dialog-title">
        <h2 class="order-dialog__title" id="order-dialog-title">Оформление заявки</h2>
        <form class="order-form" id="order-form" action="#" method="post" novalidate>
            <input id="selected-product" name="selected-product" type="hidden">

            <div class="order-form__field">
                <label class="order-form__label" for="order-name">Имя</label>
                <input
                    class="order-form__input"
                    id="order-name"
                    name="name"
                    type="text"
                    placeholder="Введите ваше имя"
                    minlength="2"
                    autocomplete="given-name"
                    required
                    aria-required="true"
                >
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="order-email">E-mail</label>
                <input
                    class="order-form__input"
                    id="order-email"
                    name="email"
                    type="email"
                    placeholder="example@mail.ru"
                    autocomplete="email"
                    required
                    aria-required="true"
                >
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="order-phone">Телефон</label>
                <input
                    class="order-form__input"
                    id="order-phone"
                    name="phone"
                    type="tel"
                    inputmode="tel"
                    placeholder="+7 (900) 000-00-00"
                    pattern="^[\\+]?[0-9\\s\\-\\(\\)]{10,20}$"
                    required
                    aria-required="true"
                >
            </div>
            <small>Формат: +7 (900) 000-00-00</small>

            <div class="order-form__field">
                <label class="order-form__label" for="order-date">Дата связи</label>
                <input
                    class="order-form__input"
                    id="order-date"
                    name="date"
                    type="date"
                >
            </div>

            <div class="order-form__field">
                <label class="order-form__label" for="order-topic">Тема заявки</label>
                <select class="order-form__select" id="order-topic" name="topic" required aria-required="true">
                    <option value="">Выберите тему</option>
                    <option value="product">Заказ товара</option>
                    <option value="consultation">Консультация</option>
                    <option value="delivery">Доставка</option>
                </select>
            </div>

            <div class="order-form__field order-form__field--wide">
                <label class="order-form__label" for="order-comment">Комментарий</label>
                <textarea
                    class="order-form__textarea"
                    id="order-comment"
                    name="comment"
                    rows="4"
                    placeholder="Укажите дополнительную информацию"
                ></textarea>
            </div>

            <div class="order-form__field order-form__field--checkbox">
                <label>
                    <input
                        id="order-agreement"
                        name="agreement"
                        type="checkbox"
                        required
                        aria-required="true"
                    >
                    Я согласен на обработку данных
                </label>
            </div>

            <div class="order-form__actions">
                <button class="button button--secondary" type="button" id="close-order-dialog">Закрыть</button>
                <button class="button button--primary" type="submit">Отправить заявку</button>
            </div>
        </form>
    </dialog>

    <p class="success-message" id="success-message" hidden>
        Форма успешно отправлена!
    </p>
</body>
</html>
