<!DOCTYPE html>
<html lang="ru">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Каталог товаров учебного интернет-магазина.">
    <title>Каталог — Beyond Shop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/catalog.js" defer></script>
    <script src="js/validation.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main">Перейти к основному содержимому</a>
    <div id="header-placeholder"></div>
    <main id="main">
        <nav class="breadcrumbs" aria-label="Хлебные крошки">
            <a class="breadcrumbs__link" href="index.html">Главная</a>
            <span class="breadcrumbs__current">Каталог</span>
        </nav>
        <section class="section">
            <h1>Каталог товаров</h1>
            <!--<p>
                На этой странице представлен учебный каталог товаров.
                В дальнейшем здесь будут добавлены фильтры, сортировка и более
                подробные карточки.
            </p>-->
        </section>
        <section class="catalog-layout">
            <aside class="catalog-filters">
                <h2>Фильтры</h2>
                <form class="filters-form" action="#" method="get">
                    <fieldset>
                        <legend>Категория</legend>
                        <select id="category-filter" class="filters-form__select">
                            <option value="all">Все товары</option>
                            <option value="accessories">Аксессуары</option>
                            <option value="electronics">Электроника</option>
                            <option value="food">Еда и деликатесы</option>
                            <option value="potions">Зелья и снадобья</option>
                            <option value="companions">Спутники и защита</option>
                            <option value="artifacts">Артефакты и снаряжение</option>
                        </select>
                    </fieldset>
                    <fieldset>
                        <legend>Сортировка</legend>
                        <select id="sort-select" class="filters-form__select">
                            <option value="default">По умолчанию</option>
                            <option value="price-asc">Цена: по возрастанию</option>
                            <option value="price-desc">Цена: по убыванию</option>
                            <option value="title">По названию</option>
                        </select>
                    </fieldset>
                </form>
            </aside>
            <section class="catalog-products">
                <h2>Список товаров</h2>
                <div class="catalog-toolbar">
                    <input class="catalog-search" id="catalog-search" type="search" placeholder="Поиск по названию..." aria-label="Поиск по названию">
                    <p class="catalog-count"></p>
                </div>
                <div class="products-grid" data-products-container></div>
                <p class="catalog-empty" hidden>Товары не найдены. Попробуйте изменить параметры поиска.</p>
            </section>
        </section>
        <section class="section" id="js-output">
            <h2>Результаты JavaScript</h2>
            <div class="js-training-block">
                <p id="js-message" class="js-message">Подключение JavaScript...</p>
                <div class="product-output" id="product-output"></div>
            </div>
        </section>
    </main>
    <a class="scroll-top" href="#main" aria-label="Наверх">↑</a>

    <div id="footer-placeholder"></div>
</body>
</html>
